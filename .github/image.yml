name: Images

on:
  push:
    branches: [main]
  pull_request:          # les tests tournent aussi sur les pull requests, sans publier
  workflow_dispatch:     # bouton « Run workflow » pour relancer à la main

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Tests : rien n'est publié si l'un d'eux échoue
  tests-serveur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  tests-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # 2. Images : construites et publiées sur ghcr.io
  images:
    needs: [tests-serveur, tests-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nom: madeqrcard-api
            dossier: backend
          - nom: madeqrcard-web
            dossier: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # pour construire aussi l'image ARM
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dossier }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}

  # 3. Déploiement : seulement sur main, et seulement une fois le VPS prêt
  deploiement:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOIEMENT_ACTIF == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/madeqrcard
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
