# Administration app (apps/admin), built with base /admin/.
location = /admin {
    return 301 /admin/;
}

location /admin/assets/ {
    include /etc/nginx/snippets/admin-access.conf;
    alias /usr/share/nginx/admin/assets/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/admin-security-headers.conf;
}

location /admin/ {
    include /etc/nginx/snippets/admin-access.conf;
    alias /usr/share/nginx/admin/;
    try_files $uri /admin/index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/admin-security-headers.conf;
}
