# Settings shared by every server block.
server_tokens off;
# Relative Location headers: TLS is terminated by Traefik, so Nginx must not build http:// redirects.
absolute_redirect off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
}

# The backend's actuator and API docs are never exposed.
location /actuator/ { return 404; }
location /v3/ { return 404; }
location /swagger-ui { return 404; }
